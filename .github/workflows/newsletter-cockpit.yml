name: Newsletter — solicitações do frontend
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automation/newsletter/check-queue.json']
permissions:
  contents: write
concurrency:
  group: abrev-newsletter-cockpit
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar assinaturas, revisões e prevenção de reenvio
        env:
          GITHUB_ACTIONS: 'false'
        run: node --test automation/blog/publish-queue.test.mjs automation/newsletter/cockpit-dispatch.test.mjs
      - name: Validar fila assinada e enviar somente campanhas solicitadas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EXEC_URL: ${{ secrets.APPS_SCRIPT_EXEC_URL }}
          KEY: ${{ secrets.NEWSLETTER_KEY }}
          PUBLISH_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAPqHdULHlfiw15NvYYll5GZMWzQzWi07umXP+i49XPuY=
            -----END PUBLIC KEY-----
        run: node automation/newsletter/cockpit-dispatch.mjs

name: Blog — calendário de newsletters da ABREV
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: abrev-cockpit-blog-publication
  cancel-in-progress: false
jobs:
  calendario:
    if: vars.NEWSLETTER_CALENDAR_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Processar edições pelo fluxo do blog no cockpit
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=abrev-newsletter-tick" | jq -er .value)
          echo "::add-mask::$jwt"
          result="$RUNNER_TEMP/newsletter.json"
          transport=0
          status=$(curl -sS --max-time 900 --output "$result" --write-out '%{http_code}' \
            -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' --data '{}' \
            'https://abrev-agentes.tiny-book-1851.chatgpt.site/api/newsletter/calendar') || transport=$?
          printf 'Calendário HTTP %s\n' "$status"
          if [ -s "$result" ]; then cat "$result"; printf '\n'; fi
          if [ "$transport" -ne 0 ]; then exit "$transport"; fi
          case "$status" in 2??) ;; *) exit 1 ;; esac
          jq -e 'type == "array" and all(.[]; .state != "erro")' "$RUNNER_TEMP/newsletter.json"
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar data e proteção contra duplicação
        run: |
          node --test automation/blog/scheduled-newsletter.test.mjs
          node automation/blog/scheduled-newsletter.mjs
      - name: Publicar o artigo uma única vez e atualizar descoberta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=blog/black-friday-e-a-onda-de-devolucoes.html
          if [ -z "$(git status --porcelain -- "$target" blog/index.html)" ]; then
            echo 'Sem alteração a publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node automation/seo/related.mjs
          node --test automation/seo/related.test.mjs
          git add blog/*.html automation/seo/clusters.json
          git commit -m 'Blog: newsletter de 27/11 [cockpit:no-broadcast]'
          node automation/seo/sitemap.mjs
          node automation/seo/feed.mjs
          git add sitemap.xml blog/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'SEO: registrar newsletter de 27/11 no sitemap e feed'
          fi
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent

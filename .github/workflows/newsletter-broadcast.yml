name: Newsletter — disparo de novo artigo

# Dispara a newsletter quando um NOVO estudo é publicado em blog/estudos/<slug>.html
# na branch main. Chama o Web App do Google Apps Script (que envia a todos os
# inscritos ativos). Também pode ser rodado manualmente informando o slug.
#
# Requer 2 segredos no repositório (Settings → Secrets and variables → Actions):
#   APPS_SCRIPT_EXEC_URL  → a URL /exec do Web App
#   NEWSLETTER_KEY        → a mesma senha definida em BROADCAST_KEY no Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'blog/estudos/*.pdf'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (nome do arquivo sem extensão) para disparo manual'
        required: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Descobrir novos artigos e disparar a newsletter
        env:
          EXEC_URL: ${{ secrets.APPS_SCRIPT_EXEC_URL }}
          KEY: ${{ secrets.NEWSLETTER_KEY }}
          MANUAL_SLUG: ${{ github.event.inputs.slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EXEC_URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::Faltam os segredos APPS_SCRIPT_EXEC_URL e/ou NEWSLETTER_KEY."
            exit 1
          fi

          disparar() {
            slug="$1"
            echo "→ Disparando newsletter para: $slug"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -L \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"broadcast\",\"key\":\"${KEY}\",\"slug\":\"${slug}\"}" \
              "$EXEC_URL")
            echo "HTTP $code"
            cat /tmp/resp.json 2>/dev/null || true
            echo
            if [ "$code" != "200" ]; then
              echo "::warning::Resposta HTTP $code ao disparar '$slug'."
            fi
          }

          # Disparo manual (workflow_dispatch)
          if [ -n "${MANUAL_SLUG:-}" ]; then
            disparar "$MANUAL_SLUG"
            exit 0
          fi

          # Disparo automático: apenas arquivos ADICIONADOS neste push
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Commit anterior indisponível (primeiro push?). Nada a disparar."
            exit 0
          fi

          added=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'blog/estudos/*.pdf' || true)
          if [ -z "$added" ]; then
            echo "Nenhum estudo novo em blog/estudos/. Nada a disparar."
            exit 0
          fi

          echo "Novos estudos detectados:"
          echo "$added"
          echo "$added" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f")
            slug="${base%.pdf}"
            disparar "$slug"
          done

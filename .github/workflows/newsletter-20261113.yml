name: Newsletter — edição autorizada de 13 de novembro
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnóstico ou disparo autorizado de 13/11
        required: true
        type: choice
        default: diagnostic
        options: [diagnostic, send]
permissions:
  contents: write
concurrency:
  group: abrev-newsletter-cockpit
  cancel-in-progress: false
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar prevenção de reenvio
        env:
          GITHUB_ACTIONS: 'false'
        run: node --test automation/newsletter/cockpit-dispatch.test.mjs
      - name: Executar somente a edição autorizada
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAMPAIGN_MODE: ${{ inputs.mode }}
          EXEC_URL: ${{ secrets.APPS_SCRIPT_EXEC_URL }}
          KEY: ${{ secrets.NEWSLETTER_KEY }}
        run: node automation/newsletter/edition-20261113.mjs
      - name: Preservar comprovante sem dados dos destinatários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-20261113-report
          path: newsletter-20261113-report.json
          if-no-files-found: ignore
